# application.properties - VERSÃO TEMPORÁRIA (só para testar)
spring.application.name=demo

# Porta (8080 costuma estar ocupada por outro projeto do Tulio)
server.port=8090

# Banco de dados
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.url=jdbc:mysql://localhost:3306/skyboards?createDatabaseIfNotExist=true

# JPA
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# JWT Secret (vem do .env; o default abaixo é só pra dev local)
jwt.secret=${JWT_SECRET:dev-skyboards-local-secret-change-me-please-0123456789}

# Arquivo
arquivamento.path=C:/var

# Upload
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB

# Email (credenciais vêm do .env; nunca commitar valores reais)
spring.mail.host=${MAIL_HOST:smtp.hostinger.com}
spring.mail.port=465
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.ssl.enable=true
spring.mail.properties.mail.smtp.socketFactory.port=465
spring.mail.properties.mail.smtp.socketFactory.class=javax.net.ssl.SSLSocketFactory
spring.mail.properties.mail.smtp.socketFactory.fallback=false